# Netherbrain : `docker compose up --build`, puis ouvrir http://localhost:3000
name: netherbrain

services:
  db:
    image: pgvector/pgvector:pg18 # PostgreSQL + l'extension pgvector (pour le RAG)
    environment:
      POSTGRES_USER: netherbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netherbrain}
      POSTGRES_DB: netherbrain
    ports:
      - "127.0.0.1:5432:5432" # pour lancer l'API hors de Docker pendant le développement
    volumes:
      # PostgreSQL 18 range ses données dans /var/lib/postgresql/18/… : on monte le dossier parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netherbrain -d netherbrain"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000" # publié sur localhost uniquement, pas sur le réseau
    env_file:
      - path: ./backend/.env # clés d'API des fournisseurs distants (facultatif)
        required: false
    environment:
      # Dans le réseau de Compose, chaque service est joignable par son nom : ici « db ».
      NETHERBRAIN_DATABASE_URL: postgresql+asyncpg://netherbrain:${POSTGRES_PASSWORD:-netherbrain}@db:5432/netherbrain
      # Dans un conteneur, « localhost » désigne le conteneur lui-même : Ollama tourne sur l'hôte.
      NETHERBRAIN_OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      # Serveur llama.cpp lancé à la main sur l'hôte ; vide : fournisseur désactivé.
      NETHERBRAIN_LLAMACPP_BASE_URL: ${LLAMACPP_BASE_URL:-}
      # Votre dossier personnel, monté juste en dessous au même chemin : les chemins sont les
      # mêmes dans le conteneur et sur la machine, ceux que vous tapez comme ceux de l'agent.
      NETHERBRAIN_ACCESS_ROOT: ${HOME}
      # L'ancien dossier de travail, où sont les projets créés avant (chemins relatifs).
      NETHERBRAIN_WORKSPACE_ROOT: ${NETHERBRAIN_WORKSPACE:-${HOME}/netherbrain-workspace}
    volumes:
      # Votre dossier personnel, et rien d'autre de la machine. En écriture, car l'agent modifie
      # des fichiers : la limite, ce sont vos accords. L'agent lit son projet seul ; tout autre
      # dossier, toute écriture et toute commande attend votre accord, et un fichier de secrets
      # (.env, ~/.ssh, ~/.config/cles) le redemande à chaque fois.
      - type: bind
        source: ${HOME}
        target: ${HOME}
        bind:
          # Dossier absent : une erreur claire, plutôt qu'un dossier créé par root, où ni vous
          # ni l'API ne pourriez écrire.
          create_host_path: false
    extra_hosts:
      - "host.docker.internal:host-gateway" # intégré à Docker Desktop, nécessaire sous Linux
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Vue depuis le navigateur : c'est donc le port publié sur localhost.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Volume nommé : les données survivent à `docker compose down` (mais pas à `down -v`).
  pgdata:
