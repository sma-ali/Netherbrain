[project]
name = "netherbrain-backend"
version = "0.1.0"
description = "Netherbrain API: a gateway that streams chat completions from multiple LLM providers"
authors = [
    { name = "Ali" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "anyio>=4.15.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "openai>=3.13.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "netherbrain"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F : erreurs classiques, I : ordre des imports, UP : syntaxe moderne,
# B : bugs probables, ASYNC : pièges de la programmation asynchrone
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
