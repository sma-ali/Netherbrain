# Configuration d'Alembic pour la ligne de commande, depuis le dossier backend/ :
#   uv run alembic upgrade head                          appliquer les migrations
#   uv run alembic revision --autogenerate -m "..."      générer une migration
# L'URL de la base vient de la configuration de l'application (NETHERBRAIN_DATABASE_URL).

[alembic]
script_location = %(here)s/src/netherbrain/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
