# Les actions sont épinglées sur des SHA de commits dans les workflows : Dependabot ouvre
# une pull request à chaque nouvelle version, pour que ces épinglages ne vieillissent pas.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
